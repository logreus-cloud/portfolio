<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 270" width="600" height="270" role="img" aria-label="Правило 01: сначала деплой, потом красота. Всё ниже реально работает; остальное приватно или слишком сырое.">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57606a" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#57606a" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="600" height="270" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="600" height="270" fill="#f6f8fa"/>
    <g fill="#1f2328" opacity="0.018"><rect x="0" y="0" width="600" height="2"/><rect x="0" y="18" width="600" height="2"/><rect x="0" y="36" width="600" height="2"/><rect x="0" y="54" width="600" height="2"/><rect x="0" y="72" width="600" height="2"/><rect x="0" y="90" width="600" height="2"/><rect x="0" y="108" width="600" height="2"/><rect x="0" y="126" width="600" height="2"/><rect x="0" y="144" width="600" height="2"/><rect x="0" y="162" width="600" height="2"/><rect x="0" y="180" width="600" height="2"/><rect x="0" y="198" width="600" height="2"/><rect x="0" y="216" width="600" height="2"/><rect x="0" y="234" width="600" height="2"/><rect x="0" y="252" width="600" height="2"/></g>

    <!-- fracture in the top-right corner, away from the text -->
    <g stroke="#57606a" fill="none" stroke-width="1">
      <polyline stroke-opacity="0.30" points="520,0 506,30 528,52 510,84 530,110 600,128"/>
      <polyline stroke-opacity="0.16" points="528,52 560,60 600,52"/>
      <polyline stroke-opacity="0.12" points="506,30 474,22"/>
    </g>
    <g stroke="#57606a" stroke-opacity="0.2" stroke-width="1">
      <polygon points="548,14 584,6 578,36 544,34" fill="url(#glass)"/>
      <polygon points="548,212 578,206 572,240 542,236" fill="url(#glass)"/>
    </g>
    <g fill="#57606a" opacity="0.22">
      <polygon points="470,70 480,66 476,82"/>
      <polygon points="580,170 590,166 586,182"/>
    </g>

    <rect x="32" y="28" width="148" height="30" rx="5" fill="#ffffff" stroke="#d0d7de"/>
    <text x="106" y="48.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="15" letter-spacing="1.5" fill="#57606a">ПРАВИЛО · 01</text>

    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="44" letter-spacing="0.5" fill="#2f363d">
      <tspan x="32" y="116">сначала деплой,</tspan>
      <tspan x="32" y="166">потом красота.</tspan>
    </text>
    <rect x="32" y="186" width="70" height="3" fill="#4b6a82" opacity="0.8"/>
    <rect x="108" y="186" width="320" height="3" fill="#d0d7de"/>

    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="21" fill="#6e7781">
      <tspan x="32" y="222">всё ниже реально работает ·</tspan>
      <tspan x="32" y="250">остальное приватно или слишком сырое</tspan>
    </text>

    <rect x="0.5" y="0.5" width="599" height="269" rx="14" fill="none" stroke="#d0d7de"/>
  </g>
</svg>
